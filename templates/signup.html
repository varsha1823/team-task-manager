<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - TaskHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -80px;
            right: -80px;
        }

        .container {
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
            opacity: 0.8;
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input, .input-box select {
            width: 100%;
            padding: 13px 45px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-box input::placeholder, .input-box select option {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-box select {
            cursor: pointer;
        }

        .input-box select option {
            color: #333;
            background: white;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .toggle {
            position: absolute;
            right: 15px;
            top: 13px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            transition: 0.3s;
        }

        .toggle:hover {
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 107, 107, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        p {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #ffd93d;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        a:hover {
            text-decoration: underline;
            color: #ff6b6b;
        }

        .role-info {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            border-left: 3px solid #36d1dc;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Join TaskHub - Manage projects efficiently</p>

    <div class="role-info">
        <i class="fas fa-info-circle"></i> <strong>Admin:</strong> Create & manage projects | <strong>Member:</strong> Work on assigned tasks
    </div>

    <form method="POST">
        <div class="input-box">
            <i class="fa fa-user"></i>
            <input type="text" name="name" placeholder="Full Name" required>
        </div>

        <div class="input-box">
            <i class="fa fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <i class="fa fa-eye toggle" onclick="togglePassword()"></i>
        </div>

        <div class="input-box">
            <i class="fa fa-user-shield"></i>
            <select name="role" required>
                <option value="" disabled selected>Select Your Role</option>
                <option value="Admin">Admin - Manage Projects</option>
                <option value="Member">Member - Work on Tasks</option>
            </select>
        </div>

        <button type="submit"><i class="fas fa-check"></i> Sign Up</button>

        <p>Already have an account? <a href="/login">Login here</a></p>
    </form>
</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    if (pass.type === "password") {
        pass.type = "text";
    } else {
        pass.type = "password";
    }
}
</script>
</body>
</html>
